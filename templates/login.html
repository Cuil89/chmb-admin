<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHMB Admin - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top left, #1a1a1a 0%, #0a0a0a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo-badge {
      width: 64px; height: 64px;
      background: #fff; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: #000; margin: 0 auto 24px;
    }
    .form-control {
      background: #1e1e1e !important; border-color: #333 !important;
      color: #fff !important; border-radius: 12px; padding: 12px 16px;
    }
    .form-control:focus { border-color: #555 !important; box-shadow: none !important; }
    .btn-login {
      background: #fff; color: #000; border: none;
      border-radius: 12px; padding: 13px; font-weight: 700;
      font-size: 1rem; width: 100%; transition: all 0.2s;
    }
    .btn-login:hover { background: #e0e0e0; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-badge"><i class="bi bi-shield-lock"></i></div>
    <h1 class="text-center text-white fw-900 mb-1" style="font-size:1.6rem; letter-spacing:2px;">CHMB ADMIN</h1>
    <p class="text-center mb-4" style="color:#555; font-size:0.85rem;">Management Console - Masuk dengan akun admin kamu</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 px-3 mb-3" style="font-size:0.85rem;">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary" style="font-size:0.8rem; font-weight:600;">USERNAME</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-4">
        <label class="form-label text-secondary" style="font-size:0.8rem; font-weight:600;">PASSWORD</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-arrow-right-circle me-2"></i>Masuk ke Dashboard
      </button>
    </form>

    <p class="text-center mt-4" style="font-size:0.75rem; color:#444;">
      Default: username <code>admin</code> / password <code>chmb2026</code>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
